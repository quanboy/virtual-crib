    <script>
      // Cursor dot
      const cursor = document.getElementById("cursor");
      document.addEventListener("mousemove", (e) => {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
      });
      document.addEventListener("mouseenter", () => (cursor.style.opacity = 1));
      document.addEventListener("mouseleave", () => (cursor.style.opacity = 0));

      // Scroll reveal
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry, i) => {
            if (entry.isIntersecting) {
              setTimeout(() => entry.target.classList.add("visible"), 0);
            }
          });
        },
        { threshold: 0.1 },
      );

      document
        .querySelectorAll(".reveal")
        .forEach((el) => observer.observe(el));

      // Stagger child reveals in grids

      // ── SPOTIFY ──────────────────────────────────────────────────────────────
      const SPOTIFY_API =
        "https://spotify-backend-production-265b.up.railway.app";

      function escHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fmtMs(ms) {
        const s = Math.floor(ms / 1000);
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      }

      let _elapsedTimer = null;
      let _elapsedStart = null;

      function startElapsedTick(durationMs, startMs = 0) {
        if (_elapsedTimer) clearInterval(_elapsedTimer);
        _elapsedStart = Date.now() - startMs;
        _elapsedTimer = setInterval(() => {
          const el = document.getElementById("spotify-elapsed");
          if (!el) {
            clearInterval(_elapsedTimer);
            return;
          }
          el.textContent = fmtMs(
            Math.min(Date.now() - _elapsedStart, durationMs),
          );
        }, 1000);
      }

      function renderWidget(html) {
        document.getElementById("spotify-widget").innerHTML = html;
      }

      function artEl(url) {
        return url
          ? `<img class="spotify-art" src="${escHtml(url)}" alt="">`
          : `<div class="spotify-art-placeholder"></div>`;
      }

      function showNowPlaying(data) {
        if (!data.isPlaying || !data.title) return false;
        const progressMs = data.progressMs || 0;
        const timeHtml = data.durationMs
          ? `<div class="spotify-time"><span id="spotify-elapsed">${escHtml(fmtMs(progressMs))}</span> / ${escHtml(fmtMs(data.durationMs))}</div>`
          : "";
        renderWidget(
          `<div class="spotify-card">` +
            `<div class="spotify-inner">` +
            artEl(data.albumArt) +
            `<div class="spotify-text">` +
            `<div class="spotify-title">${escHtml(data.title)}</div>` +
            `<div class="spotify-meta">${escHtml(data.artist)} · ${escHtml(data.album)}</div>` +
            timeHtml +
            `</div></div></div>`,
        );
        if (data.durationMs) startElapsedTick(data.durationMs, progressMs);
        return true;
      }

      function showRecentlyPlayed(tracks) {
        if (!tracks || !tracks.length) return;
        const t = tracks[0];
        renderWidget(
          `<div class="spotify-card">` +
            `<div class="spotify-inner">` +
            artEl(t.albumArt) +
            `<div class="spotify-text">` +
            `<div class="spotify-title">${escHtml(t.title)}</div>` +
            `<div class="spotify-meta">${escHtml(t.artist)} · ${escHtml(t.album)}</div>` +
            `<div class="spotify-time spotify-note">recently played</div>` +
            `</div></div></div>`,
        );
      }

      async function loadSpotify() {
        try {
          const npRes = await fetch(`${SPOTIFY_API}/spotify/now-playing`);
          if (npRes.ok && showNowPlaying(await npRes.json())) return;
          const rpRes = await fetch(`${SPOTIFY_API}/spotify/recently-played`);
          if (rpRes.ok) showRecentlyPlayed(await rpRes.json());
        } catch {
          /* render nothing */
        }
      }

      // ── NEWS TICKER ──────────────────────────────────────────────────────────
      async function loadTicker() {
        try {
          const res = await fetch(`${SPOTIFY_API}/news/headlines`);
          if (!res.ok) return;
          const headlines = await res.json();
          if (!headlines.length) return;
          const items = headlines
            .map((h) => `<div class="ticker-item">${escHtml(h)}</div>`)
            .join("");
          document.getElementById("ticker-track").innerHTML = items + items;
          document.getElementById("ticker-bar").style.display = "flex";
        } catch {
          /* hide ticker, render nothing */
        }
      }
      loadTicker();

      loadSpotify();
      setInterval(async () => {
        try {
          const npRes = await fetch(`${SPOTIFY_API}/spotify/now-playing`);
          if (!npRes.ok) return;
          const data = await npRes.json();
          if (data.isPlaying && data.title) {
            showNowPlaying(data);
          } else {
            if (_elapsedTimer) {
              clearInterval(_elapsedTimer);
              _elapsedTimer = null;
            }
            const rpRes = await fetch(`${SPOTIFY_API}/spotify/recently-played`);
            if (rpRes.ok) showRecentlyPlayed(await rpRes.json());
          }
        } catch {
          /* ignore */
        }
      }, 10000);
      setInterval(loadTicker, 300000);
    </script>
